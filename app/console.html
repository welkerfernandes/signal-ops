<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal Ops</title>
<style>body{margin:0;background:#0b1020;color:#dce5f6;font:16px system-ui}main{max-width:1050px;margin:60px auto;padding:24px}small{color:#6ee7c3;letter-spacing:3px}h1{font-size:52px;margin-bottom:8px}p{color:#a4b3cf}section{background:#141e33;padding:24px;border:1px solid #2b3954;border-radius:16px;margin:24px 0}input,textarea,select,button{background:#0b1020;color:#dce5f6;border:1px solid #465576;border-radius:8px;padding:12px;box-sizing:border-box;font:inherit}input,textarea{width:100%;margin:8px 0}button{background:#6ee7c3;color:#07140f;cursor:pointer;font-weight:700}pre{white-space:pre-wrap;overflow-wrap:anywhere}a{color:#6ee7c3}label{display:block}textarea{min-height:200px}</style>
<main><small>ENGINEERING / WORKBENCH</small><h1>Signal Ops</h1><p>Decisões de rollout apoiadas em evidência estatística</p><a href="/docs">Explorar contrato OpenAPI →</a>
<section><h2>Executar operação</h2><p>Ambiente local. Selecione uma operação e ajuste os dados antes de enviar.</p><label>Chave de API<input id="key" value="local-alpha" type="password"></label><label>Operação<select id="operation"></select></label><label>Payload JSON<textarea id="payload" spellcheck="false"></textarea></label><button id="send">Executar</button></section><section aria-live="polite"><h2>Resposta</h2><pre id="result">Aguardando operação.</pre></section></main>
<script>
const operations=[{"label": "Avaliar canário com regressão", "path": "/evaluations", "body": {"service": "checkout", "baseline_ms": [100, 102, 98, 101, 99, 100, 102, 98, 101, 99, 100, 102, 98, 101, 99, 100, 102, 98, 101, 99, 100, 102, 98, 101, 99, 100, 102, 98, 101, 99, 100, 102, 98, 101, 99, 100, 102, 98, 101, 99], "candidate_ms": [180, 182, 178, 181, 179, 180, 182, 178, 181, 179, 180, 182, 178, 181, 179, 180, 182, 178, 181, 179, 180, 182, 178, 181, 179, 180, 182, 178, 181, 179, 180, 182, 178, 181, 179, 180, 182, 178, 181, 179], "max_regression": 0.15, "idempotency_key": "canary-001"}}, {"label": "Consultar avaliações", "path": "/evaluations", "method": "GET", "body": {}}];
const select=document.getElementById('operation'), payload=document.getElementById('payload'), result=document.getElementById('result');
operations.forEach((o,i)=>{let item=document.createElement('option');item.value=i;item.textContent=o.label;select.append(item)});
function populate(){payload.value=JSON.stringify(operations[select.value].body,null,2)}select.onchange=populate;populate();
document.getElementById('send').onclick=async()=>{const o=operations[select.value];try{const body=JSON.parse(payload.value);const response=await fetch(o.path,{method:o.method||'POST',headers:{'Content-Type':'application/json','X-API-Key':document.getElementById('key').value},...(o.method==='GET'?{}:{body:JSON.stringify(body)})});result.textContent=response.status+' '+JSON.stringify(await response.json(),null,2)}catch(e){result.textContent=e.message}};
</script></html>
